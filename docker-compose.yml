services:
  postgres:
    image: postgres:16-alpine
    container_name: vsl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vsl
      POSTGRES_USER: vsl
      POSTGRES_PASSWORD: vsl_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vsl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsl -d vsl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vsl_postgres_data:
    name: vsl_postgres_data
